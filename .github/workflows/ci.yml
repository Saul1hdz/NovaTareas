name: CI

on:
  push:
    branches: [main, master, develop, testing]
  pull_request:
    branches: [main, master]

# Solo lectura por defecto. El trabajo que publica la imagen amplía sus
# permisos en su propio bloque; ningún otro puede escribir en el repositorio.
permissions:
  contents: read

# Dos pushes seguidos a la misma rama cancelan la ejecución anterior en vez de
# competir por los runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Pruebas, PostgreSQL y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novatareas
          POSTGRES_PASSWORD: ci-password-ficticia
          POSTGRES_DB: novatareas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novatareas -d novatareas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://novatareas:ci-password-ficticia@127.0.0.1:5432/novatareas_test
      # La suite recrea el esquema en la base que indique TEST_DATABASE_URL, que
      # debe terminar en `_test`. Antes esta variable no existía y las pruebas
      # corrían sobre SQLite mientras el workflow migraba PostgreSQL al lado.
      TEST_DATABASE_URL: postgresql://novatareas:ci-password-ficticia@127.0.0.1:5432/novatareas_test
      SECRET_KEY: clave-solo-para-pruebas-de-ci
      CRON_SECRET: cron-solo-para-pruebas-de-ci
      TELEGRAM_WEBHOOK_SECRET: telegram-solo-para-pruebas-de-ci
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      ZAI_API_KEY: ''
      OLLAMA_URL: http://127.0.0.1:1

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          # Misma versión que fija el Dockerfile, para que un fallo por versión
          # aparezca en CI y no al construir la imagen.
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos y sintaxis
        run: npm run lint

      - name: Migrar PostgreSQL efímero
        run: npm run db:pg:migrate

      - name: Comprobar PostgreSQL efímero
        run: npm run db:pg:check

      # z.ai, Ollama, Telegram y Google se sustituyen por dobles controlados.
      # No se usan credenciales reales ni se consume saldo.
      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cobertura-vitest
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Compilar el proyecto
        run: npm run build

      # El target de producción nunca se construía en CI, así que un fallo solo
      # se descubría al desplegar.
      - name: Construir la imagen de producción
        run: docker build --target runtime -t novatareas:ci .

      - name: Comprobar que la imagen arranca y responde
        run: |
          docker run -d --name novatareas-ci \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SECRET_KEY="$SECRET_KEY" \
            -e CRON_SECRET="$CRON_SECRET" \
            novatareas:ci
          for _intento in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4321/api/v1/health/ready; then
              echo "La imagen responde correctamente."
              exit 0
            fi
            sleep 2
          done
          echo "La imagen no respondió a tiempo."
          docker logs novatareas-ci
          exit 1
