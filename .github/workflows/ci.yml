name: CI

on:
  push:
    branches: [main, master, develop, testing]
  pull_request:
    branches: [main, master]

# Solo lectura por defecto. El trabajo que publica la imagen amplía sus
# permisos en su propio bloque; ningún otro puede escribir en el repositorio.
permissions:
  contents: read

# Dos pushes seguidos a la misma rama cancelan la ejecución anterior en vez de
# competir por los runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Pruebas, PostgreSQL y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novatareas
          POSTGRES_PASSWORD: ci-password-ficticia
          POSTGRES_DB: novatareas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novatareas -d novatareas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://novatareas:ci-password-ficticia@127.0.0.1:5432/novatareas_test
      # La suite recrea el esquema en la base que indique TEST_DATABASE_URL, que
      # debe terminar en `_test`. Antes esta variable no existía y las pruebas
      # corrían sobre SQLite mientras el workflow migraba PostgreSQL al lado.
      TEST_DATABASE_URL: postgresql://novatareas:ci-password-ficticia@127.0.0.1:5432/novatareas_test
      SECRET_KEY: clave-solo-para-pruebas-de-ci
      CRON_SECRET: cron-solo-para-pruebas-de-ci
      TELEGRAM_WEBHOOK_SECRET: telegram-solo-para-pruebas-de-ci
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      ZAI_API_KEY: ''
      OLLAMA_URL: http://127.0.0.1:1

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          # Misma versión que fija el Dockerfile, para que un fallo por versión
          # aparezca en CI y no al construir la imagen.
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos y sintaxis
        run: npm run lint

      - name: Migrar PostgreSQL efímero
        run: npm run db:pg:migrate

      - name: Comprobar PostgreSQL efímero
        run: npm run db:pg:check

      # z.ai, Ollama, Telegram y Google se sustituyen por dobles controlados.
      # No se usan credenciales reales ni se consume saldo.
      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cobertura-vitest
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Compilar el proyecto
        run: npm run build

  imagen:
    name: Imagen de produccion
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write   # unico trabajo que puede publicar en GHCR

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novatareas
          POSTGRES_PASSWORD: ci-password-ficticia
          POSTGRES_DB: novatareas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novatareas -d novatareas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IMAGEN: ghcr.io/saul1hdz/novatareas
      DATABASE_URL: postgresql://novatareas:ci-password-ficticia@127.0.0.1:5432/novatareas_test
      SECRET_KEY: clave-solo-para-pruebas-de-ci
      CRON_SECRET: cron-solo-para-pruebas-de-ci
      TELEGRAM_WEBHOOK_SECRET: telegram-solo-para-pruebas-de-ci
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7.0.1
        with:
          # `fetch-depth: 2` y no el 1 por defecto: el resumen para Argus de la
          # tarea 4 compara `HEAD~1` con `HEAD` para detectar migraciones
          # nuevas, y con un solo commit descargado ese `HEAD~1` no existe.
          fetch-depth: 2

      # El target de producción nunca se construía en CI, así que un fallo solo
      # se descubría al desplegar.
      - name: Construir la imagen de producción
        run: docker build --target runtime -t novatareas:ci .

      # Migrar con la propia imagen reproduce el servicio `migrate` de
      # compose.prod.yml. Antes CI migraba con el Node del runner, así que
      # nunca comprobaba que la imagen publicada supiera migrar por su cuenta.
      - name: Migrar usando la propia imagen
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            novatareas:ci node scripts/migrate-postgres.mjs

      - name: Comprobar que la imagen arranca y responde
        run: |
          docker run -d --name novatareas-ci \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SECRET_KEY="$SECRET_KEY" \
            -e CRON_SECRET="$CRON_SECRET" \
            -e TELEGRAM_WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET" \
            -e TOKEN_ENCRYPTION_KEY="$TOKEN_ENCRYPTION_KEY" \
            novatareas:ci
          for _intento in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4321/api/v1/health/ready; then
              echo "La imagen responde correctamente."
              exit 0
            fi
            sleep 2
          done
          echo "La imagen no respondió a tiempo."
          docker logs novatareas-ci
          exit 1

      # Va ANTES de publicar: una imagen vulnerable falla aquí y nunca llega al
      # registro. `ignore-unfixed` evita bloquear por CVEs de Debian sin parche
      # disponible, que detendrían el trabajo sin ofrecer ninguna acción.
      - name: Analizar vulnerabilidades de la imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: novatareas:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Calcular las etiquetas
        if: github.ref == 'refs/heads/main'
        id: etiquetas
        run: |
          SHA_CORTO=$(git rev-parse --short=7 HEAD)
          VERSION=$(awk '/^release:/{f=1} f && /^  version:/{gsub(/["[:space:]]/,"",$2); print $2; exit}' release-manifest.yml)
          if [ -z "$VERSION" ]; then
            echo "No se pudo leer release.version de release-manifest.yml"
            exit 1
          fi
          echo "sha_corto=$SHA_CORTO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Etiquetas: sha-$SHA_CORTO, $VERSION, latest"

      - name: Entrar en GHCR
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publicar la imagen
        if: github.ref == 'refs/heads/main'
        run: |
          SHA_CORTO=${{ steps.etiquetas.outputs.sha_corto }}
          VERSION=${{ steps.etiquetas.outputs.version }}
          for etiqueta in "sha-$SHA_CORTO" "$VERSION" latest; do
            docker tag novatareas:ci "$IMAGEN:$etiqueta"
            docker push "$IMAGEN:$etiqueta"
          done

      # El resumen aparece en la página de la ejecución. Argus no tiene que
      # deducir si el despliegue toca el esquema: se lo dice el pipeline.
      - name: Preparar el bloque de despliegue para Argus
        if: github.ref == 'refs/heads/main'
        run: |
          SHA_CORTO=${{ steps.etiquetas.outputs.sha_corto }}
          MIGRACIONES=$(git diff --name-only HEAD~1 HEAD -- migrations/postgresql/ | grep '\.sql$' || true)
          {
            echo "## Despliegue para Argus"
            echo
            echo "Imagen: \`ghcr.io/saul1hdz/novatareas:sha-$SHA_CORTO\`"
            echo
            if [ -n "$MIGRACIONES" ]; then
              echo "### ATENCION: este commit trae migraciones nuevas"
              # awk y no `sed 's/^/- /'`: shellcheck marca ese sed (SC2001) y la
              # puerta de actionlint es de aviso cero.
              echo "$MIGRACIONES" | awk '{ print "- " $0 }'
              echo
              echo "Revisar si alguna es destructiva ANTES de desplegar."
              echo "Volver el codigo NO revierte el esquema."
            else
              echo "Sin migraciones nuevas: el esquema no cambia."
            fi
            echo
            echo "### VPS compartido"
            echo "- Usar siempre \`-p novatareas-prod\`."
            echo "- Nunca \`docker system prune\` ni \`docker image prune -a\`."
            echo "- No exponer el puerto 5432."
          } >> "$GITHUB_STEP_SUMMARY"

  seguridad:
    name: Cadena de suministro
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Sin `needs`: no depende de las pruebas, así que corre en paralelo y no
    # alarga el reloj del pipeline.
    permissions:
      contents: read
      security-events: write   # publicar hallazgos de CodeQL
      actions: read

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7.0.1
        with:
          # Gitleaks necesita el historial completo: un secreto borrado en el
          # último commit sigue estando en los anteriores y sigue expuesto.
          fetch-depth: 0

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Umbral `high` y no `moderate` a propósito: una puerta que salta cada
      # semana por algo que no afecta acaba desactivada, y una puerta
      # desactivada no protege nada.
      - name: Auditar dependencias
        run: npm audit --audit-level=high

      # Saul1hdz es cuenta personal, no organización: no requiere licencia.
      - name: Buscar secretos en el historial
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analizar el código con CodeQL
        uses: github/codeql-action/analyze@v4
