name: novatareas-prod

# Despliegue de producción. A diferencia de compose.dev.yml:
#   - no construye nada: consume la imagen que CI publicó en GHCR, y no monta
#     el código como volumen;
#   - no publica el puerto de PostgreSQL;
#   - toma todos los secretos del entorno, sin valores por defecto;
#   - el healthcheck consulta la base de datos, no solo el proceso.
#
# Requiere un archivo .env junto a este compose. Ver docs/DESPLIEGUE.md.

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://novatareas:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}@db:5432/novatareas
  PG_POOL_MAX: "${PG_POOL_MAX:-10}"
  SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY}
  CRON_SECRET: ${CRON_SECRET:?define CRON_SECRET}
  REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-false}"
  EMAIL_VERIFICATION_REQUIRED: "${EMAIL_VERIFICATION_REQUIRED:-false}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_SECURE: "${SMTP_SECURE:-false}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  SMTP_FROM: "${SMTP_FROM:-}"
  PUBLIC_APP_URL: "${PUBLIC_APP_URL:-}"
  APP_TIME_ZONE: ${APP_TIME_ZONE:-America/El_Salvador}
  AVATAR_UPLOAD_DIR: /app/dist/client/avatars

# Producción ya no construye: consume la imagen que CI publicó tras pasar las
# pruebas, el arranque real y el escaneo de vulnerabilidades. Así lo que corre
# aquí es el artefacto exacto que se validó, no una reconstrucción hecha en
# otra máquina y en otro momento.
x-app-image: &app-image
  image: ghcr.io/saul1hdz/novatareas:${NOVATAREAS_TAG:-latest}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novatareas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: novatareas
    # Sin `ports`: la base solo es accesible desde la red interna del compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novatareas -d novatareas"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - novatareas_prod_pgdata:/var/lib/postgresql/data

  migrate:
    <<: *app-image
    restart: "no"
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "scripts/migrate-postgres.mjs"]

  web:
    <<: *app-image
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Solo escucha en loopback: el proxy inverso con TLS publica el servicio.
    ports:
      - "127.0.0.1:${WEB_PORT:-4321}:4321"
    volumes:
      - novatareas_prod_avatars:/app/dist/client/avatars

  # Polling: exactamente una réplica por token. El estado conversacional y los
  # límites de uso viven en PostgreSQL, así que sobrevive a los reinicios.
  bot:
    <<: *app-image
    profiles: ["telegram"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    # El healthcheck de la imagen consulta la web; no representa la salud de un
    # proceso de polling y marcaría este contenedor como unhealthy aunque opere.
    healthcheck:
      disable: true
    command: ["node", "telegram/bot.js"]

volumes:
  novatareas_prod_pgdata:
  novatareas_prod_avatars:
