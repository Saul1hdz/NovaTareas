services:
  db:
    image: postgres:16-alpine
    container_name: novatareas-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: novatareas
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: novatareas
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novatareas -d novatareas"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - novatareas_pgdata:/var/lib/postgresql/data

volumes:
  novatareas_pgdata:
