name: novatareas

x-app-environment: &app-environment
  DATABASE_URL: postgresql://novatareas:devpassword@db:5432/novatareas
  PG_POOL_MAX: "10"

x-app-service: &app-service
  build:
    context: .
    target: development
  env_file:
    - .env
  environment:
    <<: *app-environment
  depends_on:
    migrate:
      condition: service_completed_successfully
  volumes:
    - .:/app
    - novatareas_node_modules:/app/node_modules
    - novatareas_avatars:/app/public/avatars

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novatareas
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: novatareas
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novatareas -d novatareas"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - novatareas_pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: development
    restart: "no"
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: npm run db:pg:migrate

  web:
    <<: *app-service
    restart: unless-stopped
    command: sh -c "rm -f .astro/dev.json && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:4321:4321"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # /health/ready consulta la base; /health responde 200 siempre.
        - fetch('http://127.0.0.1:4321/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bot:
    <<: *app-service
    profiles: ["telegram"]
    restart: unless-stopped
    command: npm run bot:dev

  scheduler:
    <<: *app-service
    profiles: ["scheduler"]
    restart: "no"
    command: npm run bot:scheduler

volumes:
  novatareas_pgdata:
  novatareas_node_modules:
  novatareas_avatars:
