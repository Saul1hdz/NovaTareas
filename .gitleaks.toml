# Configuración de Gitleaks para NovaTareas.
#
# Hereda todas las reglas por defecto y añade excepciones acotadas. Cada una
# está justificada: una lista de excepciones sin motivo escrito acaba creciendo
# hasta que la herramienta no detecta nada.

[extend]
useDefault = true

[allowlist]
description = "Valores ficticios que existen a propósito en el repositorio"

regexes = [
  # Clave de cifrado de las pruebas: base64url de
  # `0123456789abcdef0123456789abcdef`. La usan vitest.config.js y el workflow
  # para que la suite no dependa de una credencial real ni consuma cuota.
  # Se exime este valor exacto, no la regla `generic-api-key` entera: silenciar
  # la regla dejaría pasar la siguiente clave, que sí podría ser real.
  '''MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY''',

  # La misma clave de prueba en su forma hexadecimal, que es lo que se
  # decodifica del valor de arriba. Vivió así en `vitest.config.js` y en el
  # workflow, y los documentos de `docs/superpowers/` la citan al describirlos,
  # así que sigue apareciendo en el historial aunque el árbol actual ya no la
  # use tal cual. Se exime el valor exacto y no la ruta: eximir el fichero
  # apagaría el escaneo sobre todo lo demás que ese documento pegue.
  '''0123456789abcdef0123456789abcdef''',

  # Secretos de prueba declarados como tales en vitest.config.js y en el
  # workflow. El sufijo es literal y no aparece en ningún valor real.
  '''[a-z-]+-solo-para-pruebas(-de-ci)?''',
]

paths = [
  # Plantilla de entorno: por definición no contiene valores reales, y el
  # propio fichero avisa de que el .env real nunca se versiona.
  '''\.env\.example$''',

  # Aquí NO se eximen árboles de documentación. `docs/superpowers/` estuvo
  # exento entero porque sus documentos citan los valores ficticios del
  # workflow, pero esos valores ya los cubren los dos regexes de arriba y la
  # convención del proyecto manda pegar ahí salidas reales: cadenas de
  # conexión, journal del servidor y respuestas de API. Eximir la ruta apagaba
  # el escaneo justo donde más probable es que aparezca un secreto de verdad.
]
